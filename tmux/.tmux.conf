# Minimal tmux configuration

# Terminal colors: 256-color with true-color (RGB) overrides. -ga appends, so
# reset first or every reload stacks another copy of the override.
set -g default-terminal "tmux-256color"
set -gu terminal-overrides
set -ga terminal-overrides ",*256col*:Tc"

# Snappier Esc in vim/nvim
set -sg escape-time 10

# Scrollback
set -g history-limit 10000

# Number windows and panes from 1; keep numbering contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar: the default status-left-length of 10 truncates session names to 7
set -g status-left-length 30

# Highlight the session name while the prefix key is pending
set -g status-left "#{?client_prefix,#[reverse],}[#S]#[default] "

# Mark the active pane: a title bar per pane, drawn in the border's style
setw -g pane-border-format "#{?pane_in_mode,, #{pane_current_command} }"
setw -g pane-border-style "fg=colour238"
setw -g pane-active-border-style "fg=colour110,bold"

# The row is what makes the active pane legible: with two panes tmux draws one
# divider and lights it only for the pane on its left, so the other being active
# shows nothing at all. A row per pane gives each its own segment to colour.
# Only worth the line when there is another pane to tell apart, though.
setw -g pane-border-status off
set -g command-alias[101] pane-border-auto='if -F \
  "#{?#{==:#{window_panes},1},0,1}" \
  "setw pane-border-status top" \
  "setw pane-border-status off"'
set-hook -g window-layout-changed pane-border-auto

# The hooks only fire on a change; catch the windows that already exist, so a
# reload does not leave splits without their title bar
run-shell 'tmux list-windows -a -F "##{window_id} ##{window_panes}" \
  | while read w n; do \
      if [ "$n" = 1 ]; then tmux setw -t "$w" pane-border-status off; \
      else tmux setw -t "$w" pane-border-status top; fi; \
    done'

# vi-style keys in copy mode. mode-keys vi still selects with Space and copies
# with Enter; use v and y like vim, moving rectangle-toggle off v to C-v where
# vim has block select.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Splits: | vertical, - horizontal, open in current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation. Rebind the arrows too, dropping their default -r
# so a pane switch ends the prefix instead of holding it open for repeat-time.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# `prefix :reload` re-sources this file in place. Plain -g, not -ga: appending
# to an indexed element concatenates onto it, so a reload broke the alias.
set -g command-alias[100] reload="source-file ~/.tmux.conf"
